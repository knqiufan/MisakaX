[package]
name = "misaka-x"
version = "0.1.0"
description = "MisakaX - Desktop AI Agent Client"
authors = ["you"]
edition = "2021"

[features]
test-private = []

[lib]
name = "misaka_x_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# --- Tauri core ---
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"

# --- Database ---
rusqlite = { version = "0.34", features = ["bundled", "vtab"] }
sqlite-vec = "0.1"

# --- Async runtime ---
tokio = { version = "1", features = ["full"] }

# --- Serialization ---
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

# --- HTTP client ---
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "blocking", "native-tls", "charset", "http2", "macos-system-configuration"] }

# --- Utilities ---
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = "0.3"

# --- Filesystem ---
walkdir = "2"
glob = "0.3"
notify = "7"
dirs = "6"
zip = { version = "2.4", default-features = false, features = ["deflate"] }

# --- Concurrency ---
dashmap = "6"

# --- Workspace terminal ---
# Keep PTY APIs pinned to the version validated by the W3 portability PoC.
portable-pty = "=0.9.0"

# --- Cryptography ---
aes-gcm = "0.10"
hkdf = "0.12"
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"

# --- LLM framework (Phase 2) ---
rig-core = { version = "0.36", default-features = false, features = ["derive", "reqwest", "native-tls"] }

# --- MCP (Phase 3) ---
rmcp = { version = "1.6", features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest", "reqwest-native-tls"] }
http = "1"

# --- MCP HTTP Bridge (Phase 4) ---
axum = "0.8"

# --- Stream processing ---
futures = "0.3"

# --- Async trait support ---
async-trait = "0.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

[target.'cfg(unix)'.dependencies]
libc = "=0.2.186"

[dev-dependencies]
tempfile = "3"
